<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhatsApp - Kenai</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #efeae2;
    font-family: Arial, Helvetica, sans-serif;
}

.card {
    width: 330px;
    background: white;
    border-radius: 18px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #25D366;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    flex-shrink: 0;
}

.info {
    flex: 1;
}

.name {
    font-size: 18px;
    font-weight: bold;
    color: #111;
}

.status {
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 7px;
    color: #667781;
    font-size: 14px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #25D366;
}

.offline {
    background: #8696a0;
}

.loading {
    background: #f0ad4e;
}

.time {
    margin-top: 5px;
    font-size: 11px;
    color: #8696a0;
}
</style>
</head>

<body>

<div class="card">

    <div class="avatar">K</div>

    <div class="info">

        <div class="name">
            Kenai
        </div>

        <div class="status">
            <span id="dot" class="dot loading"></span>
            <span id="statusText">
                Comprobando...
            </span>
        </div>

        <div id="time" class="time">
            Actualizando...
        </div>

    </div>

</div>

<script>

async function actualizarEstado() {

    try {

        const respuesta = await fetch(
            "status.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        const datos = await respuesta.json();

        const dot = document.getElementById("dot");
        const texto = document.getElementById("statusText");
        const hora = document.getElementById("time");

        if (datos.online === true) {

            dot.className = "dot";
            texto.textContent = "En línea";

        } else {

            dot.className = "dot offline";
            texto.textContent = "Desconectado";

        }

        if (datos.updated_at) {

            const fecha = new Date(datos.updated_at);

            hora.textContent =
                "Última actualización: " +
                fecha.toLocaleTimeString("es-ES");

        } else {

            hora.textContent = "Estado actualizado";

        }

    } catch (error) {

        document.getElementById("dot").className =
            "dot loading";

        document.getElementById("statusText").textContent =
            "Estado no disponible";

        document.getElementById("time").textContent =
            "No se pudo comprobar";

    }

}


/* Primera comprobación */
actualizarEstado();


/* Comprobar cada 5 segundos */
setInterval(actualizarEstado, 5000);

</script>

</body>
</html>
